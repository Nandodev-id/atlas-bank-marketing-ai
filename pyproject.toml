[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-bank-marketing-ai"
version = "0.1.0"
description = "Responsible bank marketing prediction — Simplon C1–C9 certification project"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "Proprietary — educational project" }
authors = []
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.1,<3",
    "scikit-learn>=1.4,<2",
    "joblib>=1.3,<2",
]

[project.optional-dependencies]
api = ["fastapi>=0.115,<1", "pydantic>=2.6,<3", "uvicorn>=0.30,<1", "httpx>=0.27,<1"]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "nbformat>=5,<6", "ipykernel>=6,<8"]
mlops = ["mlflow>=2.14,<4", "prometheus-client>=0.20,<1"]
ui = ["streamlit>=1.39,<2"]

[project.scripts]
bank-marketing-data-check = "bank_marketing.data.inspection:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
