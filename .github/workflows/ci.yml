name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-runtime.txt && pip install -e '.[dev]'
      - name: Compile source and scripts
        run: python -m compileall -q src scripts ui tests
      - name: Verify data-independent contracts and HTTP behavior
        run: pytest -q --junitxml=reports/pytest.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-evidence
          path: reports/pytest.xml
